version: 2.1

defaults: &defaults
  working_directory: ~/repo
  machine: true

commands:
  load-nvm:
    steps:
      - run:
          name: Load NVM
          command: |
            echo 'export NVM_DIR="/opt/circleci/.nvm"' >> $BASH_ENV
            echo ' [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> $BASH_ENV
  configure-yarn:
    steps:
      - load-nvm
      - run:
          name: Configure Yarn
          command: |
            nvm install v20.17.0
            nvm use v20.17.0
            nvm alias default v20.17.0
            corepack enable
            yarn set version berry
      - restore_cache:
          keys:
            - yarn-packages-v1-{{ .Branch }}-{{ checksum "yarn.lock" }}
            - yarn-packages-v1-{{ .Branch }}-
            - yarn-packages-v1-

jobs:
  test:
    <<: *defaults

    steps:
      - checkout
      - configure-yarn
      - run:
          name: Setup project
          command: |
            corepack enable
            yarn set version berry
            yarn
      - run:
          name: Test project
          command: |
            corepack enable
            yarn set version berry
            yarn test

workflows:
  version: 2
  test:
    jobs:
      - test
